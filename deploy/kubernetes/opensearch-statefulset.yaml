# Opensearch StatefulSet with optional TLS support for production security requirements
#
# TLS Configuration Environment Variables (all optional, default to disabled state):
# | Variable Name | Type | Allowed Values | Default | Description |
# |---------------|------|----------------|---------|-------------|
# | `OPENSEARCH_HTTP_TLS_ENABLED` | boolean | `true`/`false` | `false` | Toggle TLS encryption for port 9200 (HTTP API) |
# | `OPENSEARCH_TRANSPORT_TLS_ENABLED` | boolean | `true`/`false` | `false` | Toggle TLS encryption for port 9300 (inter-node transport) |
# | `OPENSEARCH_HTTP_CLIENT_AUTH_REQUIRED` | boolean | `true`/`false` | `false` | Enforce mTLS client certificate authentication for HTTP API (9200) requests |
# | `OPENSEARCH_TRANSPORT_CLIENT_AUTH_REQUIRED` | boolean | `true`/`false` | `false` | Enforce mTLS client certificate authentication for inter-node transport (9300) connections |
#
# Certificate Mount Paths (all optional, required only when corresponding TLS features are enabled):
# Mount from user-provided Kubernetes Secrets:
# - CA certificate chain: /etc/opensearch/certs/ca/ca.crt (required when any TLS is enabled)
# - HTTP server certificate: /etc/opensearch/certs/http/tls.crt (required when OPENSEARCH_HTTP_TLS_ENABLED=true)
# - HTTP server private key: /etc/opensearch/certs/http/tls.key (required when OPENSEARCH_HTTP_TLS_ENABLED=true)
# - Transport server certificate: /etc/opensearch/certs/transport/tls.crt (required when OPENSEARCH_TRANSPORT_TLS_ENABLED=true)
# - Transport server private key: /etc/opensearch/certs/transport/tls.key (required when OPENSEARCH_TRANSPORT_TLS_ENABLED=true)
# - Client CA certificate chain (for mTLS): /etc/opensearch/certs/client-ca/ca.crt (required when any *_CLIENT_AUTH_REQUIRED=true)
#
# Example Secret creation commands:
# kubectl create secret generic opensearch-ca --from-file=ca.crt=./your-ca.crt
# kubectl create secret generic opensearch-http-tls --from-file=tls.crt=./http.crt --from-file=tls.key=./http.key
# kubectl create secret generic opensearch-transport-tls --from-file=tls.crt=./transport.crt --from-file=tls.key=./transport.key
# kubectl create secret generic opensearch-client-ca --from-file=ca.crt=./client-ca.crt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  serviceName: opensearch
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:3.5.0
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        env:
        - name: cluster.name
          value: demo-cluster
        - name: node.name
          value: demo-node
        - name: bootstrap.memory_lock
          value: "true"
        - name: discovery.type
          value: single-node
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: "true"
        # Disable security plugin only when TLS is fully disabled for backward compatibility
        - name: DISABLE_SECURITY_PLUGIN
          value: "$(OPENSEARCH_HTTP_TLS_ENABLED:$(OPENSEARCH_TRANSPORT_TLS_ENABLED:true:false):false)"
        # TLS Configuration Environment Variables (defaults match spec)
        - name: OPENSEARCH_HTTP_TLS_ENABLED
          value: "false"
        - name: OPENSEARCH_TRANSPORT_TLS_ENABLED
          value: "false"
        - name: OPENSEARCH_HTTP_CLIENT_AUTH_REQUIRED
          value: "false"
        - name: OPENSEARCH_TRANSPORT_CLIENT_AUTH_REQUIRED
          value: "false"
        # HTTP TLS Configuration
        - name: plugins.security.ssl.http.enabled
          value: "$(OPENSEARCH_HTTP_TLS_ENABLED)"
        - name: plugins.security.ssl.http.pemcert_filepath
          value: "/etc/opensearch/certs/http/tls.crt"
        - name: plugins.security.ssl.http.pemkey_filepath
          value: "/etc/opensearch/certs/http/tls.key"
        - name: plugins.security.ssl.http.pemtrustedcas_filepath
          value: "/etc/opensearch/certs/ca/ca.crt"
        - name: plugins.security.ssl.http.clientauth_mode
          value: "$(OPENSEARCH_HTTP_CLIENT_AUTH_REQUIRED:REQUIRE:NONE)"
        - name: plugins.security.ssl.http.enabled_protocols
          value: "TLSv1.2,TLSv1.3"
        # Transport TLS Configuration
        - name: plugins.security.ssl.transport.enabled
          value: "$(OPENSEARCH_TRANSPORT_TLS_ENABLED)"
        - name: plugins.security.ssl.transport.pemcert_filepath
          value: "/etc/opensearch/certs/transport/tls.crt"
        - name: plugins.security.ssl.transport.pemkey_filepath
          value: "/etc/opensearch/certs/transport/tls.key"
        - name: plugins.security.ssl.transport.pemtrustedcas_filepath
          value: "/etc/opensearch/certs/ca/ca.crt"
        - name: plugins.security.ssl.transport.clientauth_mode
          value: "$(OPENSEARCH_TRANSPORT_CLIENT_AUTH_REQUIRED:REQUIRE:NONE)"
        - name: plugins.security.ssl.transport.enabled_protocols
          value: "TLSv1.2,TLSv1.3"
        livenessProbe:
          httpGet:
            path: /
            port: 9200
            scheme: "$(OPENSEARCH_HTTP_TLS_ENABLED:HTTPS:HTTP)"
            caFile: /etc/opensearch/certs/ca/ca.crt
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
            scheme: "$(OPENSEARCH_HTTP_TLS_ENABLED:HTTPS:HTTP)"
            caFile: /etc/opensearch/certs/ca/ca.crt
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 2
          failureThreshold: 3
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: opensearch-data
          mountPath: /usr/share/opensearch/data
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /usr/share/opensearch/logs
        # Certificate volume mounts (all optional, only required when TLS is enabled)
        - name: opensearch-ca
          mountPath: /etc/opensearch/certs/ca
          readOnly: true
        - name: opensearch-http-tls
          mountPath: /etc/opensearch/certs/http
          readOnly: true
        - name: opensearch-transport-tls
          mountPath: /etc/opensearch/certs/transport
          readOnly: true
        - name: opensearch-client-ca
          mountPath: /etc/opensearch/certs/client-ca
          readOnly: true
        ulimits:
          memlock:
            soft: -1
            hard: -1
          nofile:
            soft: 65536
            hard: 65536
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}
      # Certificate volumes (all optional, no mounts required by default)
      - name: opensearch-ca
        secret:
          secretName: opensearch-ca
          optional: true
      - name: opensearch-http-tls
        secret:
          secretName: opensearch-http-tls
          optional: true
      - name: opensearch-transport-tls
        secret:
          secretName: opensearch-transport-tls
          optional: true
      - name: opensearch-client-ca
        secret:
          secretName: opensearch-client-ca
          optional: true
  volumeClaimTemplates:
  - metadata:
      name: opensearch-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  ports:
  - port: 9200
    name: http
  - port: 9300
    name: transport
  selector:
    app.kubernetes.io/name: opensearch
