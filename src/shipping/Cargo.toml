[package]
name = "shipping"
edition = "2021"

[lib]
name = "shipping"
path = "src/lib.rs"

[[bin]]
name = "shipping"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4", features = ["rustls"] }
rustls = "0.21.0"
rustls-pemfile = "1.0.3"
thiserror = "1.0.40"
actix-governor = "0.6.0"
governor = "0.6.3"
anyhow = "1.0.102"
awc = { version = "3.8.2", default-features = false, features = ["compress-zstd"] }
open-feature = "0.2"
open-feature-flagd = { version = "0.1", default-features = false, features = ["rpc"] }
serde = { version = "1.0.228", features = ["derive"] }
validator = { version = "0.18", features = ["derive"] }
tonic = "0.14.6"
tower-governor = "0.6.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4.38"

opentelemetry = "0.32.0"
opentelemetry_proto = { git = "https://github.com/open-telemetry/opentelemetry-demo.git", branch = "main" }
opentelemetry_sdk = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry-instrumentation-actix-web = { version = "0.24.0", features = ["sync-middleware", "awc", "metrics"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-resource-detectors = "0.11.0"
rand = "0.8.5"
prometheus = "0.14.0"
metrics-exporter-prometheus = "0.18.3"
tower = "0.5.3"

[dependencies.uuid]
version = "1.23.1"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[dev-dependencies]
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
libc = "0.2"
tracing-test = "0.2.6"
tempfile = "3.0"
regex = "1.10"
