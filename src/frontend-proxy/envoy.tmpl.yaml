{{ $upstreamTlsEnabled := eq (getenv "FRONTEND_PROXY_UPSTREAM_TLS_ENABLED" "false") "true" }}
{{ $upstreamTlsMinVersion := getenv "FRONTEND_PROXY_UPSTREAM_TLS_MIN_VERSION" "TLSv1_2" }}
{{ $upstreamTlsMaxVersion := getenv "FRONTEND_PROXY_UPSTREAM_TLS_MAX_VERSION" "TLSv1_3" }}
{{ $upstreamCaPath := getenv "FRONTEND_PROXY_UPSTREAM_TLS_CA_BUNDLE_PATH" "" }}

{{ $retryMaxAttempts := getenv "ENVOY_RETRY_MAX_ATTEMPTS" "2" | toInt }}
{{ $retryOn := getenv "ENVOY_RETRY_ON" "5xx,gateway-error,connect-failure,refused-stream" }}
{{ $circuitBreakerMaxConnections := getenv "ENVOY_CIRCUIT_BREAKER_MAX_CONNECTIONS" "1024" | toInt }}
{{ $circuitBreakerMaxPendingRequests := getenv "ENVOY_CIRCUIT_BREAKER_MAX_PENDING_REQUESTS" "1024" | toInt }}
{{ $circuitBreakerMaxRetries := getenv "ENVOY_CIRCUIT_BREAKER_MAX_RETRIES" "512" | toInt }}
{{ $retryBudgetFraction := getenv "ENVOY_RETRY_BUDGET_FRACTION" "0.2" | toFloat }}
{{ $retryBudgetMinRetryConcurrency := getenv "ENVOY_RETRY_BUDGET_MIN_RETRY_CONCURRENCY" "10" | toInt }}

{{/* Rate limit configuration defaults per route type */}}
{{ $publicRoutes := list "frontend" "static" }}
{{ $internalAPIRoutes := list "products" "cart" "checkout" "shipping" "payment" "user" }}

{{/* Helper function to get route rate limit config */}}
{{ define "get_rate_limit_config" }}
  {{ $routeName := . }}
  {{ $defaultRPS := 100 }}
  {{ $defaultBurst := 20 }}
  {{ if has $routeName $internalAPIRoutes }}
    {{ $defaultRPS = 1000 }}
    {{ $defaultBurst = 200 }}
  {{ end }}
  {{ $rps := getenv (printf "FRONTEND_PROXY_RATE_LIMIT_%s_RPS" (upper $routeName)) (toString $defaultRPS) | toInt }}
  {{ $burst := getenv (printf "FRONTEND_PROXY_RATE_LIMIT_%s_BURST" (upper $routeName)) (toString $defaultBurst) | toInt }}
  {{ if gt $rps 0 }}
  typed_per_filter_config:
    envoy.filters.http.local_ratelimit:
      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
      stat_prefix: http_local_rate_limiter
      token_bucket:
        max_tokens: {{ $burst }}
        tokens_per_fill: {{ $rps }}
        fill_interval: "1s"
      filter_enabled:
        runtime_key: "local_rate_limit_enabled"
        default_value:
          numerator: 100
          denominator: HUNDRED
      filter_enforced:
        runtime_key: "local_rate_limit_enforced"
        default_value:
          numerator: 100
          denominator: HUNDRED
      response_headers_to_add:
        - append: false
          header:
            key: "x-ratelimit-limit"
            value: "{{ $rps }}"
        - append: false
          header:
            key: "x-ratelimit-remaining"
            value: "%LOCAL_RATE_LIMIT_REMAINING%"
        - append: false
          header:
            key: "x-ratelimit-reset"
            value: "%LOCAL_RATE_LIMIT_RESET%"
        - append: false
          header:
            key: "retry-after"
            value: "1"
      enable_x_ratelimit_headers: DRAFT_VERSION_03
  {{ end }}
{{ end }}

static_resources:
  listeners:
    - address:
        socket_address:
          address: "${ENVOY_ADDR}"
          port_value: ${ENVOY_PORT}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                tracing:
                  spawn_upstream_span: true
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: opentelemetry_collector_grpc
                        timeout: 0.250s
                      service_name: ${OTEL_SERVICE_NAME}
                      resource_detectors:
                        - name: envoy.tracers.opentelemetry.resource_detectors.environment
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.tracers.opentelemetry.resource_detectors.v3.EnvironmentResourceDetectorConfig
{{ if eq (getenv "FRONTEND_PROXY_TLS_ENABLED" "false") "true" }}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: {{ getenv "FRONTEND_PROXY_TLS_MIN_VERSION" "TLSv1_2" }}
                  tls_maximum_protocol_version: {{ getenv "FRONTEND_PROXY_TLS_MAX_VERSION" "TLSv1_3" }}
                tls_certificates:
                  - certificate_chain:
                      filename: {{ getenv "FRONTEND_PROXY_TLS_CERT_PATH" "" }}
                    private_key:
                      filename: {{ getenv "FRONTEND_PROXY_TLS_KEY_PATH" "" }}
{{ if eq (getenv "FRONTEND_PROXY_MTLS_ENABLED" "false") "true" }}
                validation_context:
                  trusted_ca:
                    filename: {{ getenv "FRONTEND_PROXY_MTLS_CA_BUNDLE_PATH" "" }}
              require_client_certificate: true
{{ end }}
{{ end }}
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: frontend
                      domains:
                        - "*"
                      retry_policy:
                        retry_on: "{{ $retryOn }}"
                        num_retries: {{ $retryMaxAttempts }}
                        retriable_request_headers:
                          - name: ":method"
                            exact_match: "GET"
                          - name: ":method"
                            exact_match: "HEAD"
                      routes:
                        - match: { path: "/healthz" }
                          direct_response:
                            status: 200
                            body:
                              inline_string: "ok"
                          response_headers_to_add:
                            - append: false
                              header:
                                key: "Content-Type"
                                value: "text/plain"
                          typed_per_filter_config:
                            envoy.filters.http.rbac:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                              rbac:
                                rules:
                                  action: ALLOW
                                  policies:
                                    internal-ips-only:
                                      permissions:
                                        - any: true
                                      principals:
                                        - source_ip:
                                            address_prefix: "10.0.0.0"
                                            prefix_len: 8
                                        - source_ip:
                                            address_prefix: "172.16.0.0"
                                            prefix_len: 12
                                        - source_ip:
                                            address_prefix: "192.168.0.0"
                                            prefix_len: 16
                                        - source_ip:
                                            address_prefix: "127.0.0.0"
                                            prefix_len: 8
                        - match: { path: "/readyz" }
                          direct_response:
                            status: 200
                            body:
                              inline_string: "ok"
                          response_headers_to_add:
                            - append: false
                              header:
                                key: "Content-Type"
                                value: "text/plain"
                          typed_per_filter_config:
                            envoy.filters.http.rbac:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                              rbac:
                                rules:
                                  action: ALLOW
                                  policies:
                                    internal-ips-only:
                                      permissions:
                                        - any: true
                                      principals:
                                        - source_ip:
                                            address_prefix: "10.0.0.0"
                                            prefix_len: 8
                                        - source_ip:
                                            address_prefix: "172.16.0.0"
                                            prefix_len: 12
                                        - source_ip:
                                            address_prefix: "192.168.0.0"
                                            prefix_len: 16
                                        - source_ip:
                                            address_prefix: "127.0.0.0"
                                            prefix_len: 8
                        - match: { path: "/loadgen" }
                          redirect: { path_redirect: "/loadgen/" }
                        - match: { prefix: "/loadgen/" }
                          route: { cluster: loadgen, prefix_rewrite: "/" }
                        - match: { prefix: "/otlp-http/" }
                          route: { cluster: opentelemetry_collector_http, prefix_rewrite: "/" }
                        - match: { path: "/jaeger" }
                          redirect: { path_redirect: "/jaeger/" }
                        - match: { prefix: "/jaeger/" }
                          route: { cluster: jaeger }
                        - match: { path: "/grafana" }
                          redirect: { path_redirect: "/grafana/" }
                        - match: { prefix: "/grafana/" }
                          route: { cluster: grafana }
                        - match: { path: "/telemetry" }
                          redirect: { path_redirect: "/telemetry/" }
                        - match: { prefix: "/telemetry/" }
                          route: { cluster: telemetry-docs, prefix_rewrite: "/" }
                        - match: { prefix: "/images/" }
                          route: { cluster: image-provider, prefix_rewrite: "/" }
                        - match: { prefix: "/flagservice/" }
                          route: { cluster: flagservice, prefix_rewrite: "/", timeout: 0s }
                        - match: { prefix: "/feature" }
                          route:
                            cluster: flagd-ui
                            prefix_rewrite: "/"
                            upgrade_configs:
                              - upgrade_type: websocket
                        - match: { path: "/profiles" }
                          redirect: { path_redirect: "/profiles/" }
                        - match: { prefix: "/profiles/" }
                          route: { cluster: profiles }
                        - match: { prefix: "/" }  # Default/catch-all route - keep last since prefix:"/" matches everything
                          route: { cluster: frontend }
                http_filters:
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: DENY
                        policies:
                          deny-external-health-requests:
                            permissions:
                              - or_rules:
                                  rules:
                                    - header:
                                        name: ":path"
                                        exact_match: "/healthz"
                                    - header:
                                        name: ":path"
                                        exact_match: "/readyz"
                            principals:
                              - not_id:
                                  or_ids:
                                    ids:
                                      - source_ip:
                                          address_prefix: "10.0.0.0"
                                          prefix_len: 8
                                      - source_ip:
                                          address_prefix: "172.16.0.0"
                                          prefix_len: 12
                                      - source_ip:
                                          address_prefix: "192.168.0.0"
                                          prefix_len: 16
                                      - source_ip:
                                          address_prefix: "127.0.0.0"
                                          prefix_len: 8
                  - name: envoy.filters.http.fault
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                      max_active_faults: 100
                      delay:
                        header_delay: {}
                        percentage:
                          numerator: 100
                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      cluster_min_healthy_percentages:
                        "*": { value: 100 }
                      headers:
                        - name: ":path"
                          exact_match: "/readyz"
                      response_headers_to_add:
                        - append: false
                          header:
                            key: "Content-Type"
                            value: "text/plain"
                      healthy_status: 200
                      healthy_body:
                        inline_string: "ok"
                      unhealthy_status: 503
                  - name: envoy.filters.http.retry_budget
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.retry_budget.v3.RetryBudget
                      budget_percent:
                        value: {{ mul $retryBudgetFraction 100 }}
                      min_retry_concurrency: {{ $retryBudgetMinRetryConcurrency }}
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      status:
                        code: TOO_MANY_REQUESTS
                      response_headers_to_add:
                        - append: false
                          header:
                            key: "content-type"
                            value: "text/plain"
                      enable_x_ratelimit_headers: DRAFT_VERSION_03
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log:
                  - name: envoy.access_loggers.open_telemetry
                    typed_config:
                      "@type": "type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig"
                      common_config:
                        log_name: "otel_envoy_access_log"
                        grpc_service:
                          envoy_grpc:
                            cluster_name: opentelemetry_collector_grpc
                        transport_api_version: "V3"
                      body:
                        # yamllint disable-line rule:line-length
                        string_value: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %RESPONSE_CODE_DETAILS% %CONNECTION_TERMINATION_DETAILS% \"%UPSTREAM_TRANSPORT_FAILURE_REASON%\" %BYTES_RECEIVED% %BYTES_SENT% %DURATION% %RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)% \"%REQ(X-FORWARDED-FOR)%\" \"%REQ(USER-AGENT)%\" \"%REQ(X-REQUEST-ID)%\" \"%REQ(:AUTHORITY)%\" \"%UPSTREAM_HOST%\" %UPSTREAM_CLUSTER% %UPSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_REMOTE_ADDRESS% %REQUESTED_SERVER_NAME% %ROUTE_NAME%\n"
                      resource_attributes:
                        values:
                          - key: "service.name"
                            value:
                              string_value: ${OTEL_SERVICE_NAME}
                      attributes:
                        values:
                          - key: "destination.address"
                            value:
                              string_value: "%UPSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          - key: "event.name"
                            value:
                              string_value: "proxy.access"
                          - key: "server.address"
                            value:
                              string_value: "%DOWNSTREAM_LOCAL_ADDRESS%"
                          - key: "source.address"
                            value:
                              string_value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          - key: "upstream.cluster"
                            value:
                              string_value: "%UPSTREAM_CLUSTER%"
                          - key: "upstream.host"
                            value:
                              string_value: "%UPSTREAM_HOST%"
                          - key: "user_agent.original"
                            value:
                              string_value: "%REQ(USER-AGENT)%"
                          - key: "url.full"
                            value:
                              string_value: "%REQ(:SCHEME)%://%REQ(:AUTHORITY)%%REQ(:PATH)%"
                          - key: "url.path"
                            value:
                              string_value: "%REQ(:PATH)%"
                          - key: "url.query"
                            value:
                              string_value: "%REQ(:QUERY)%"
                          - key: "url.template"
                            value:
                              string_value: "%ROUTE_NAME%"
  clusters:
{{ $upstreamTlsEnabled := eq (getenv "FRONTEND_PROXY_UPSTREAM_TLS_ENABLED" "false") "true" }}
{{ if $upstreamTlsEnabled }}
{{ $upstreamTlsMinVersion := getenv "FRONTEND_PROXY_UPSTREAM_TLS_MIN_VERSION" "TLSv1_2" }}
{{ $upstreamTlsMaxVersion := getenv "FRONTEND_PROXY_UPSTREAM_TLS_MAX_VERSION" "TLSv1_3" }}
{{ $upstreamCaPath := getenv "FRONTEND_PROXY_UPSTREAM_TLS_CA_BUNDLE_PATH" "" }}
{{ end }}
    - name: opentelemetry_collector_grpc
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: opentelemetry_collector_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${OTEL_COLLECTOR_HOST}
                      port_value: ${OTEL_COLLECTOR_PORT_GRPC}
    - name: opentelemetry_collector_http
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: opentelemetry_collector_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${OTEL_COLLECTOR_HOST}
                      port_value: ${OTEL_COLLECTOR_PORT_HTTP}
    - name: frontend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: {{ $circuitBreakerMaxConnections }}
            max_pending_requests: {{ $circuitBreakerMaxPendingRequests }}
            max_retries: {{ $circuitBreakerMaxRetries }}
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: frontend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FRONTEND_HOST}
                      port_value: ${FRONTEND_PORT}
    - name: image-provider
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: {{ $circuitBreakerMaxConnections }}
            max_pending_requests: {{ $circuitBreakerMaxPendingRequests }}
            max_retries: {{ $circuitBreakerMaxRetries }}
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: image-provider
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${IMAGE_PROVIDER_HOST}
                      port_value: ${IMAGE_PROVIDER_PORT}
    - name: flagservice
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: flagservice
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FLAGD_HOST}
                      port_value: ${FLAGD_PORT}
    - name: flagd-ui
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: flagd-ui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FLAGD_UI_HOST}
                      port_value: ${FLAGD_UI_PORT}
    - name: loadgen
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: loadgen
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${LOCUST_WEB_HOST}
                      port_value: ${LOCUST_WEB_PORT}
    - name: grafana
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: grafana
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${GRAFANA_HOST}
                      port_value: ${GRAFANA_PORT}
    - name: jaeger
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: jaeger
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${JAEGER_HOST}
                      port_value: ${JAEGER_UI_PORT}
    - name: telemetry-docs
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: telemetry-docs
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${TELEMETRY_DOCS_HOST}
                      port_value: ${TELEMETRY_DOCS_PORT}
    - name: profiles
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
{{ if $upstreamTlsEnabled }}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: {{ $upstreamTlsMinVersion }}
              tls_maximum_protocol_version: {{ $upstreamTlsMaxVersion }}
            validation_context:
              trusted_ca:
                filename: {{ $upstreamCaPath }}
{{ end }}
      load_assignment:
        cluster_name: profiles
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FIREPIT_HOST}
                      port_value: ${FIREPIT_PORT}
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: ${ENVOY_ADMIN_PORT}
layered_runtime:
  layers:
    - name: static_layer_0
