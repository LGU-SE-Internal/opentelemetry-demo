apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: "latest"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: opentelemetry-demo
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: health
      port: 9090
      targetPort: 9090
      protocol: TCP
