apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: "latest"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: email
      app.kubernetes.io/part-of: opentelemetry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/version: "latest"
    spec:
      serviceAccountName: email-service
      containers:
      - name: email
        image: ghcr.io/lgu-se-internal/opentelemetry-demo/email:latest
        ports:
        - name: grpc
          containerPort: 8080
        - name: health
          containerPort: 9090
        - name: metrics
          containerPort: 9464
        env:
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: email-service-config
              key: smtp_host
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USERNAME
          valueFrom:
            configMapKeyRef:
              name: email-service-config
              key: smtp_username
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-service-secret
              key: smtp_password
        - name: SERVICE_PORT
          value: "8080"
        - name: HEALTH_PORT
          value: "9090"
        - name: LOG_LEVEL
          value: "info"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: otel-collector-config
              key: otlp_endpoint
        - name: OTEL_SERVICE_NAME
          value: email
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
