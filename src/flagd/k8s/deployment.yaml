apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/component: feature-flags
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd
        app.kubernetes.io/component: feature-flags
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
      - name: set-pvc-permissions
        image: busybox:latest
        command: ["chown", "-R", "1001:1001", "/var/lib/flagd/config"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: flagd-custom-config
          mountPath: /var/lib/flagd/config
      containers:
      - name: flagd
        image: ghcr.io/open-feature/flagd:v0.8.1
        command: ["/entrypoint.sh"]
        ports:
        - name: grpc
          containerPort: 50051
        - name: http
          containerPort: 8013
        volumeMounts:
        - name: flagd-config
          mountPath: /etc/flagd
        - name: flagd-custom-config
          mountPath: /var/lib/flagd/config
        env:
        - name: FLAGD_CUSTOM_CONFIG_PATH
          value: "/var/lib/flagd/config/flags.json"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: flagd-config
        configMap:
          name: flagd-config
      - name: flagd-custom-config
        persistentVolumeClaim:
          claimName: flagd-custom-config
