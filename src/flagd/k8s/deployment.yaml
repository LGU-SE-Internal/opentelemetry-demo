apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-flagd
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/component: feature-flags
    app.kubernetes.io/part-of: opentelemetry-demo
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8016"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd
        app.kubernetes.io/component: feature-flags
        app.kubernetes.io/part-of: opentelemetry-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8016"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      containers:
      - name: flagd
        image: ghcr.io/open-feature/flagd:v0.10.1
        ports:
        - name: grpc
          containerPort: 8013
          protocol: TCP
        - name: http
          containerPort: 8016
          protocol: TCP
        env:
        - name: FLAGD_TLS_ENABLED
          value: "false"
        - name: FLAGD_TLS_CERT_PATH
          value: ""
        - name: FLAGD_TLS_KEY_PATH
          value: ""
        - name: FLAGD_MTLS_ENABLED
          value: "false"
        - name: FLAGD_MTLS_CA_CERT_PATH
          value: ""
        - name: FLAGD_GRACEFUL_SHUTDOWN_TIMEOUT
          value: "30s"
        - name: FLAGD_CUSTOM_CONFIG_PATH
          value: "/var/lib/flagd/config/flags.json"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8016
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8016
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        securityContext:
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: flagd-custom-config
          mountPath: /var/lib/flagd/config
      initContainers:
      - name: set-volume-permissions
        image: busybox:1.36
        command: ["chown", "-R", "1001:1001", "/var/lib/flagd/config"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: true
        volumeMounts:
        - name: flagd-custom-config
          mountPath: /var/lib/flagd/config
      volumes:
      - name: tmp
        emptyDir: {}
      - name: flagd-custom-config
        persistentVolumeClaim:
          claimName: flagd-custom-config
