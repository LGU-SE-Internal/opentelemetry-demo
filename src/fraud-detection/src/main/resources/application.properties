# Health check configuration
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=liveness
quarkus.smallrye-health.readiness-path=readiness
quarkus.smallrye-health.checks.status.mapping.UP=200
quarkus.smallrye-health.checks.status.mapping.DOWN=503
quarkus.smallrye-health.checks.additional-response-header.enabled=false

# Disable authentication for health endpoints
quarkus.http.auth.permission.health.paths=/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.health.enabled=true

# Metrics configuration
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.jvm.enabled=true

# Disable authentication for metrics endpoint
quarkus.http.auth.permission.metrics.paths=/q/metrics
quarkus.http.auth.permission.metrics.policy=permit
quarkus.http.auth.permission.metrics.enabled=true

# Graceful shutdown configuration
quarkus.shutdown.timeout=30S
quarkus.shutdown.wait-for-active-requests=true
quarkus.http.shutdown.grace-period=30S

# Run on the same port as main service (default 8080)
quarkus.http.port=8080
