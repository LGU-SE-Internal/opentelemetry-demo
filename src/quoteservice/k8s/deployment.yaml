apiVersion: apps/v1
kind: Deployment
metadata:
  name: quoteservice
  labels:
    app.kubernetes.io/name: quoteservice
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: opentelemetry-demo
    app: quoteservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quoteservice
      app.kubernetes.io/component: service
      app.kubernetes.io/part-of: opentelemetry-demo
      app: quoteservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quoteservice
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: opentelemetry-demo
        app: quoteservice
    spec:
      serviceAccountName: quote-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - quoteservice
            topologyKey: kubernetes.io/hostname
      volumes:
        - name: tls-certs
          secret:
            secretName: quoteservice-tls
            optional: true
        - name: client-ca
          secret:
            secretName: quoteservice-client-ca
            optional: true
      containers:
      - name: quoteservice
        image: ${QUOTE_SERVICE_IMAGE}:${QUOTE_SERVICE_TAG}
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: grpc
        volumeMounts:
          - name: tls-certs
            mountPath: /etc/quoteservice/tls/
            readOnly: true
          - name: client-ca
            mountPath: /etc/quoteservice/client-ca/
            readOnly: true
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
            scheme: {{ if eq .Values.quoteservice.http.tls.enabled "true" }}HTTPS{{ else }}HTTP{{ end }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: {{ if eq .Values.quoteservice.http.tls.enabled "true" }}HTTPS{{ else }}HTTP{{ end }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          privileged: false
        env:
          - name: OTEL_SERVICE_NAME
            value: "quote-service"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otelcol.opentelemetry-demo.svc.cluster.local:4318"
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "http/protobuf"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "service.namespace=opentelemetry-demo"
          - name: QUOTESERVICE_HTTP_TLS_ENABLED
            value: {{ .Values.quoteservice.http.tls.enabled | default "false" | quote }}
          - name: QUOTESERVICE_HTTP_TLS_CERT_PATH
            value: {{ .Values.quoteservice.http.tls.certPath | default "/etc/quoteservice/tls/tls.crt" | quote }}
          - name: QUOTESERVICE_HTTP_TLS_KEY_PATH
            value: {{ .Values.quoteservice.http.tls.keyPath | default "/etc/quoteservice/tls/tls.key" | quote }}
          - name: QUOTESERVICE_HTTP_TLS_CLIENT_CA_PATH
            value: {{ .Values.quoteservice.http.tls.clientCAPath | default "/etc/quoteservice/client-ca/ca.crt" | quote }}
          - name: QUOTESERVICE_GRPC_TLS_ENABLED
            value: {{ .Values.quoteservice.grpc.tls.enabled | default "false" | quote }}
          - name: QUOTESERVICE_GRPC_TLS_CERT_PATH
            value: {{ .Values.quoteservice.grpc.tls.certPath | default "/etc/quoteservice/tls/tls.crt" | quote }}
          - name: QUOTESERVICE_GRPC_TLS_KEY_PATH
            value: {{ .Values.quoteservice.grpc.tls.keyPath | default "/etc/quoteservice/tls/tls.key" | quote }}
          - name: QUOTESERVICE_GRPC_TLS_CLIENT_CA_PATH
            value: {{ .Values.quoteservice.grpc.tls.clientCAPath | default "/etc/quoteservice/client-ca/ca.crt" | quote }}
