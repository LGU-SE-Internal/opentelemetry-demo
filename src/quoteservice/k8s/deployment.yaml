apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-service
  labels:
    app.kubernetes.io/name: quote-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quote-service
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quote-service
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      serviceAccountName: quote-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        readOnlyRootFilesystem: true
      containers:
      - name: quote-service
        image: ${QUOTE_SERVICE_IMAGE}:${QUOTE_SERVICE_TAG}
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: grpc
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - "ALL"
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: OTEL_SERVICE_NAME
            value: "quote-service"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otelcol.opentelemetry-demo.svc.cluster.local:4318"
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "http/protobuf"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "service.namespace=opentelemetry-demo"
