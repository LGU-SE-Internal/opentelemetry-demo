apiVersion: v1
kind: Service
metadata:
  name: flagd-ui
  labels:
    app.kubernetes.io/name: flagd-ui
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: feature-flag-ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 4000
      protocol: TCP
    - name: https
      port: 443
      targetPort: 4001
      protocol: TCP
  selector:
    app.kubernetes.io/name: flagd-ui
