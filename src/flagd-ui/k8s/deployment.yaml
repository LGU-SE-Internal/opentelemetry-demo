apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd-ui
  labels:
    app.kubernetes.io/name: flagd-ui
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: feature-flag-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd-ui
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/component: feature-flag-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: flagd-ui
        image: ghcr.io/open-telemetry/demo:latest-flagd-ui
        ports:
        - name: http
          containerPort: 4000
          protocol: TCP
        - name: https
          containerPort: 4001
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: FLAGD_UI_TLS_ENABLED
          value: "false"
        - name: FLAGD_UI_TLS_CERT_PATH
          value: ""
        - name: FLAGD_UI_TLS_KEY_PATH
          value: ""
        - name: FLAGD_UI_MTLS_ENABLED
          value: "false"
        - name: FLAGD_UI_MTLS_CA_CERT_PATH
          value: ""
