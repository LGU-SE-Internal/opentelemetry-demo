apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quote-service
  labels:
    app.kubernetes.io/name: quote-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quote-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
