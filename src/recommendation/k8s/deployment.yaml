apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-demo-recommendation
  labels:
    app.kubernetes.io/name: recommendation
    app.kubernetes.io/instance: otel-demo
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: opentelemetry-demo
    opentelemetry.io/demo-service: recommendation
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation
      app.kubernetes.io/instance: otel-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation
        app.kubernetes.io/instance: otel-demo
        app.kubernetes.io/version: latest
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: opentelemetry-demo
        opentelemetry.io/demo-service: recommendation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      containers:
      - name: recommendation
        image: ghcr.io/lgu-se-internal/opentelemetry-demo/recommendation-service:latest
        ports:
        - name: grpc
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          grpc:
            port: 8080
            service: recommendation
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 8080
            service: recommendation
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        securityContext:
          capabilities:
            drop:
            - ALL
