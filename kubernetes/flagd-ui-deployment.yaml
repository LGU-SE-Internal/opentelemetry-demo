apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd-ui
  labels:
    app.kubernetes.io/name: flagd-ui
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd-ui
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      containers:
      - name: flagd-ui
        image: ${FLAGD_UI_IMAGE}:${FLAGD_UI_TAG}
        ports:
        - containerPort: 4000
          name: http
        livenessProbe:
          httpGet:
            path: /health/live
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: FLAGD_UI_TLS_ENABLED
            value: "false"
          - name: FLAGD_UI_TLS_CERT_PATH
            value: ""
          - name: FLAGD_UI_TLS_KEY_PATH
            value: ""
          - name: FLAGD_UI_MTLS_ENABLED
            value: "false"
          - name: FLAGD_UI_MTLS_CA_CERT_PATH
            value: ""
