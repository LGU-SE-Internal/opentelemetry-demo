apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: service
    app.kubernetes.io/version: "1.8.0"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3550"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/component: service
        app.kubernetes.io/version: "1.8.0"
      annotations:
        instrumentation.opentelemetry.io/inject-go: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: product-catalog
        image: ghcr.io/open-telemetry/demo:1.8.0-productcatalogservice
        ports:
        - containerPort: 3550
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 3550
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3550
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
        env:
        - name: PRODUCT_CATALOG_PORT
          value: "3550"
        - name: PRODUCT_CATALOG_DB_URL
          valueFrom:
            secretKeyRef:
              name: product-catalog-db
              key: url
        - name: PRODUCT_CATALOG_FEATURE_FLAG_DISABLE_REVIEWS
          value: "false"
        - name: PRODUCT_CATALOG_FEATURE_FLAG_ENABLE_SLOW_QUERIES
          value: "false"
