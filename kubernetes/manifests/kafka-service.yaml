apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: opentelemetry-demo
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  type: ClusterIP
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
      protocol: TCP
    # Uncomment to enable TLS port
    # - name: tls
    #   port: 9093
    #   targetPort: 9093
    #   protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: kafka
