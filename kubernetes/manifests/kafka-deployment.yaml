apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: opentelemetry-demo
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
      app.kubernetes.io/name: kafka
      app.kubernetes.io/part-of: opentelemetry-demo
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/version: "latest"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        opentelemetry.io/inject-sdk: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: kafka
          image: ghcr.io/lgu-se-internal/opentelemetry-demo/kafka:latest
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: tls
            - containerPort: 9090
              name: metrics
          livenessProbe:
            exec:
              command: ["/scripts/kafka-liveness.sh"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/scripts/kafka-readiness.sh"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            privileged: false
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4317"
            - name: OTEL_SERVICE_NAME
              value: "kafka"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
        - name: tmp
          emptyDir: {}
