
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad-service
  labels:
    app: ad-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ad-service
  template:
    metadata:
      labels:
        app: ad-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: ad-service
        image: otel/demo-ad-service:latest
        ports:
        - name: health
          containerPort: 8080
        - name: grpc
          containerPort: 9555
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: GRACEFUL_SHUTDOWN_TIMEOUT
          value: "30s"
        - name: GRPC_TLS_ENABLED
          value: "false"
        - name: GRPC_TLS_CERT_PATH
          value: ""
        - name: GRPC_TLS_KEY_PATH
          value: ""
        - name: HEALTH_ENDPOINT_PORT
          value: "8080"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}

