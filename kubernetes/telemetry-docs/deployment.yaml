apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-docs
  labels:
    app.kubernetes.io/name: telemetry-docs
    app.kubernetes.io/component: documentation
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-docs
        app.kubernetes.io/component: documentation
        app.kubernetes.io/part-of: opentelemetry-demo
      annotations:
        opentelemetry.io/inject-nginx: "true"
        opentelemetry.io/nginx-service-name: "telemetry-docs"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: telemetry-docs
          image: ghcr.io/lgu-se-internal/opentelemetry-demo/telemetry-docs:v1.9.0
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
