apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-docs
  labels:
    app.kubernetes.io/name: telemetry-docs
    app.kubernetes.io/component: documentation
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-docs
        app.kubernetes.io/component: documentation
        app.kubernetes.io/part-of: opentelemetry-demo
      annotations:
        opentelemetry.io/inject-nginx: "true"
        opentelemetry.io/nginx-service-name: "telemetry-docs"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: telemetry-docs
          image: ghcr.io/lgu-se-internal/opentelemetry-demo/telemetry-docs:v1.9.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
              add:
                - "NET_BIND_SERVICE"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
