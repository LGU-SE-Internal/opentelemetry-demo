apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: ${GRAFANA_RUN_AS_NON_ROOT:-true}
        runAsUser: ${GRAFANA_RUN_AS_USER:-472}
        runAsGroup: ${GRAFANA_RUN_AS_USER:-472}
        fsGroup: ${GRAFANA_RUN_AS_USER:-472}
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: ${GRAFANA_LIVENESS_PROBE_INITIAL_DELAY:-30}
            periodSeconds: ${GRAFANA_LIVENESS_PROBE_PERIOD:-10}
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: ${GRAFANA_READINESS_PROBE_INITIAL_DELAY:-5}
            periodSeconds: ${GRAFANA_READINESS_PROBE_PERIOD:-5}
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: "${GRAFANA_CPU_REQUEST:-100m}"
              memory: "${GRAFANA_MEMORY_REQUEST:-256Mi}"
            limits:
              cpu: "${GRAFANA_CPU_LIMIT:-500m}"
              memory: "${GRAFANA_MEMORY_LIMIT:-1Gi}"
          securityContext:
            allowPrivilegeEscalation: ${GRAFANA_ALLOW_PRIVILEGE_ESCALATION:-false}
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
