apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad-service
  labels:
    app.kubernetes.io/name: ad-service
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ad-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ad-service
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ad-service
          image: otel/demo-ad-service:latest
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: 9555
              protocol: TCP
          livenessProbe:
            grpc:
              port: 9555
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 9555
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            grpc:
              port: 9555
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: AD_SERVICE_PORT
              value: "9555"
            - name: OTEL_SERVICE_NAME
              value: "ad-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=ad-service,service.namespace=opentelemetry-demo"
