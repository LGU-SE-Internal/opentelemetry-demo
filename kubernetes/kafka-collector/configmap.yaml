apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-collector-config
  labels:
    app: kafka-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      kafka:
        brokers: ["${KAFKA_BROKERS}"]
        topics: ["${KAFKA_TOPICS}"]
        encoding: otlp_proto

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
        tls:
          insecure: true
      logging:
        loglevel: info

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: :1777
      zpages:
        endpoint: :55679

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp, kafka]
          processors: [batch]
          exporters: [otlp, logging]
        metrics:
          receivers: [otlp, kafka]
          processors: [batch]
          exporters: [otlp, logging]
        logs:
          receivers: [otlp, kafka]
          processors: [batch]
          exporters: [otlp, logging]
