apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-service
  labels:
    app: accounting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounting-service
  template:
    metadata:
      labels:
        app: accounting-service
    spec:
      containers:
      - name: accounting-service
        image: ghcr.io/lgu-se-internal/opentelemetry-demo/accounting-service:latest
        ports:
        - containerPort: 8080
          name: health
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: kafka-credentials
              key: bootstrap.servers
        - name: KAFKA_CONSUMER_GROUP_ID
          value: "accounting-service-group"
        - name: KAFKA_ORDER_TOPIC
          value: "orders"
        - name: KAFKA_DLQ_TOPIC
          value: "orders-dlq"
        - name: HEALTH_PORT
          value: "8080"
        - name: RETRY_MAX_ATTEMPTS
          value: "3"
        - name: RETRY_BACKOFF_MS
          value: "1000"

