apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: "latest"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      name: http
      targetPort: 8080
      protocol: TCP
    - port: 8081
      name: grpc
      targetPort: 8081
      protocol: TCP
  selector:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: opentelemetry-demo
