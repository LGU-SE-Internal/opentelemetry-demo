apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  labels:
    app.kubernetes.io/name: shippingservice
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shippingservice
      app.kubernetes.io/part-of: opentelemetry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shippingservice
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: shippingservice
          image: ghcr.io/lgu-se-internal/opentelemetry-demo/shippingservice:latest
          ports:
            - containerPort: 8080
              name: grpc
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            privileged: false
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4317"
            - name: OTEL_SERVICE_NAME
              value: "shippingservice"
            - name: SHIPPING_SERVICE_PORT
              value: "8080"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
