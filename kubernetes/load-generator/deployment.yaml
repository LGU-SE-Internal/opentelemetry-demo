apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: load-generator
          image: ghcr.io/open-telemetry/demo:latest-loadgenerator
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: LOCUST_WAIT_TIME_MIN
              value: "100"
            - name: LOCUST_WAIT_TIME_MAX
              value: "1000"
            - name: LOCUST_TARGET_HOST
              value: "http://frontend:8080"
            - name: LOCUST_USERS
              value: "10"
            - name: LOCUST_SPAWN_RATE
              value: "1"

