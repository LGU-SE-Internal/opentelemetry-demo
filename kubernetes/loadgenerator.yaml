apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  labels:
    app.kubernetes.io/name: loadgenerator
    app.kubernetes.io/version: "1.7.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgenerator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgenerator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: loadgenerator
          image: otel/demo:latest-load-generator
          ports:
            - containerPort: 8089
              name: http
          # Health probe paths match implementation in src/load-generator/locustfile.py
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8089
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 0.25
              memory: 128Mi
            limits:
              cpu: 0.75
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            privileged: false
          env:
            - name: LOCUST_HOST
              value: http://frontend:8080
            - name: LOCUST_HEADLESS
              value: "true"
            - name: LOCUST_USERS
              value: "10"
            - name: LOCUST_SPAWN_RATE
              value: "1"
            - name: LOCUST_RUN_TIME
              value: "1h"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loadgenerator
  labels:
    app.kubernetes.io/name: loadgenerator
spec:
  type: ClusterIP
  ports:
    - port: 8089
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: loadgenerator
