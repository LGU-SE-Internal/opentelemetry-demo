apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/version: "2.14.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/instance: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/instance: jaeger
        app.kubernetes.io/version: "2.14.1"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: jaeger-config
          configMap:
            name: jaeger-config
        - name: tmp
          emptyDir: {}
      containers:
        - name: jaeger
          image: quay.io/jaegertracing/jaeger:2.14.1
          imagePullPolicy: IfNotPresent
          command:
            - /go/bin/all-in-one-linux
            - --config
            - /etc/jaeger/config.yml
          env:
            - name: COLLECTOR_TLS_ENABLED
              value: "{{ .Values.collector.tls.enabled | default false }}"
            - name: COLLECTOR_TLS_CERT_PATH
              value: "{{ .Values.collector.tls.certPath | default \"\" }}"
            - name: COLLECTOR_TLS_KEY_PATH
              value: "{{ .Values.collector.tls.keyPath | default \"\" }}"
            - name: COLLECTOR_TLS_CLIENT_CA_PATH
              value: "{{ .Values.collector.tls.clientCAPath | default \"\" }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: ui
              containerPort: 16686
              protocol: TCP
            - name: grpc-collector
              containerPort: 14250
              protocol: TCP
            - name: http-collector
              containerPort: 14268
              protocol: TCP
            - name: health-check
              containerPort: 14269
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: health-check
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health-check
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: jaeger-config
              mountPath: /etc/jaeger
              readOnly: true
            - name: tmp
              mountPath: /tmp
