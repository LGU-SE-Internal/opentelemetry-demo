apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/version: "2.14.1"
data:
  jaeger.yaml: |
    badger:
      ephemeral: false
      directory-key: /badger/key
      directory-value: /badger/data
    retention:
      go:
        traces:
          ttl: 7d
    service:
      telemetry:
        health-check-http:
          host-port: 0.0.0.0:14269
