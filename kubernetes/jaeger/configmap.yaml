apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/version: "2.14.1"
data:
  config.yml: |
    badger:
      ephemeral: true
    service:
      telemetry:
        health-check-http:
          host-port: 0.0.0.0:14269
