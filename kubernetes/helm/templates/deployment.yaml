apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: "2.14.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/part-of: opentelemetry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: jaeger
          image: quay.io/jaegertracing/jaeger:2.14.1
          ports:
            - containerPort: 16686
              name: http-ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 14250
              name: jaeger-grpc
            - containerPort: 14269
              name: admin-health
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            privileged: false
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "badger"
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_KEY
              value: "/badger/key"
            - name: BADGER_DIRECTORY_VALUE
              value: "/badger/data"
            - name: JAEGER_RETENTION_GO_TRACES_TTL
              value: {{ .Values.jaeger.retention.ttl | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jaeger-storage
              mountPath: /badger
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jaeger-storage
          persistentVolumeClaim:
            claimName: jaeger-storage
