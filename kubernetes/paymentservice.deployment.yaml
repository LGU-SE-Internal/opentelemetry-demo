apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  labels:
    app.kubernetes.io/name: paymentservice
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paymentservice
      app.kubernetes.io/part-of: opentelemetry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paymentservice
        app.kubernetes.io/part-of: opentelemetry-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: paymentservice
          image: ghcr.io/lgu-se-internal/opentelemetry-demo/paymentservice:latest
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9464
              name: metrics
          livenessProbe:
            httpGet:
              path: /health
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            privileged: false
# TLS/mTLS Configuration for Payment Service
# To enable TLS:
# 1. Create a secret in the same namespace with the following structure:
#    apiVersion: v1
#    kind: Secret
#    metadata:
#      name: payment-service-tls
#    type: Opaque
#    data:
#      tls.crt: <base64 encoded TLS server certificate>
#      tls.key: <base64 encoded TLS server private key>
#      ca.crt: <base64 encoded client CA certificate (optional, only for mTLS)>
# 2. Uncomment the volume, volumeMount, and TLS environment variables below
# 3. To enable mTLS, also uncomment the PAYMENT_SERVICE_TLS_CLIENT_CA_PATH environment variable
# Note: This configuration maintains backward compatibility - no changes required for existing non-TLS deployments
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4317"
            - name: OTEL_SERVICE_NAME
              value: "paymentservice"
            - name: PORT
              value: "50051"
            # TLS Configuration (uncomment to enable)
            # - name: PAYMENT_SERVICE_TLS_CERT_PATH
            #   value: "/etc/payment-service-tls/tls.crt"
            # - name: PAYMENT_SERVICE_TLS_KEY_PATH
            #   value: "/etc/payment-service-tls/tls.key"
            # Uncomment to enable mTLS (requires client CA certificate in secret)
            # - name: PAYMENT_SERVICE_TLS_CLIENT_CA_PATH
            #   value: "/etc/payment-service-tls/ca.crt"
            - name: RATE_LIMIT_RPS
              value: "100"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Uncomment to mount TLS secret
            # - name: payment-service-tls
            #   mountPath: /etc/payment-service-tls
            #   readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Optional TLS secret volume (uncomment to enable TLS/mTLS)
        # - name: payment-service-tls
        #   secret:
        #     secretName: payment-service-tls
        #     optional: true
