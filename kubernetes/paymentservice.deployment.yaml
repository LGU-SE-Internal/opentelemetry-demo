apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  labels:
    app.kubernetes.io/name: paymentservice
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paymentservice
      app.kubernetes.io/part-of: opentelemetry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paymentservice
        app.kubernetes.io/part-of: opentelemetry-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: paymentservice
          image: ghcr.io/lgu-se-internal/opentelemetry-demo/paymentservice:latest
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9464
              name: metrics
          livenessProbe:
            httpGet:
              path: /health
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            privileged: false
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol:4317"
            - name: OTEL_SERVICE_NAME
              value: "paymentservice"
            - name: PORT
              value: "50051"
            - name: TLS_ENABLED
              value: "false"
            - name: TLS_CERT_PATH
              value: ""
            - name: TLS_KEY_PATH
              value: ""
            - name: RATE_LIMIT_RPS
              value: "100"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
