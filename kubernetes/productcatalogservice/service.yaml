apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-productcatalogservice
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: productcatalogservice
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: productcatalogservice
  ports:
  - name: grpc
    port: 8080
    targetPort: 8080
  - name: http
    port: 8081
    targetPort: 8081
