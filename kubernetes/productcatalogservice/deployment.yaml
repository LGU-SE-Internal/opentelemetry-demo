apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: opentelemetry-demo-productcatalogservice
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      containers:
      - name: product-catalog
        image: otel/demo-product-catalog:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: grpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: product-catalog-postgres-secret
              key: db_host
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: product-catalog-postgres-secret
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: product-catalog-postgres-secret
              key: db_password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: product-catalog-postgres-secret
              key: db_name
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_SERVICE_NAME
          value: "product-catalog"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
