apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-productcatalogservice
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: productcatalogservice
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: productcatalogservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: productcatalogservice
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: opentelemetry-demo-productcatalogservice
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      containers:
      - name: productcatalogservice
        image: /opentelemetry-demo-productcatalogservice:latest
        ports:
        - containerPort: 8080
          name: grpc
        - containerPort: 8081
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 2
        env:
        - name: POSTGRES_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: productcatalogservice-postgres-secret
              key: connectionString
        - name: TLS_ENABLED
          value: "false"
        - name: TLS_CERT_PATH
          value: "/tls/tls.crt"
        - name: TLS_KEY_PATH
          value: "/tls/tls.key"
        - name: FEATURE_FLAG_ENDPOINT
          value: "opentelemetry-demo-flagd:8013"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
