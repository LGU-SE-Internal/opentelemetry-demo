apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  serviceName: kafka-broker
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kafka
        image: opentelemetry-demo-kafka:latest
        ports:
        - name: broker
          containerPort: 9092
          protocol: TCP
        - name: controller
          containerPort: 9093
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        startupProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - name: kafka-broker-data
          mountPath: /var/lib/kafka/data
      volumes:
      - name: kafka-broker-data
        persistentVolumeClaim:
          claimName: kafka-broker-data
