apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: broker
    protocol: TCP
    name: broker
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
