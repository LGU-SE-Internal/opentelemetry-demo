apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
  labels:
    app.kubernetes.io/name: opentelemetry-demo
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: opentelemetry-demo
    app.kubernetes.io/component: prometheus
