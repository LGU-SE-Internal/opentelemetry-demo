apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-product-reviews
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: product-reviews
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: product-reviews
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-reviews
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/component: service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      containers:
      - name: product-reviews
        image: otel/demo:latest-product-reviews
        ports:
        - containerPort: 8080
          name: grpc
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          grpc:
            port: 8080
            service: product_reviews
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 8080
            service: product_reviews
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: OTEL_SERVICE_NAME
          value: product-reviews
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otelcol:4317
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
