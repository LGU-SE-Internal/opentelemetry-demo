apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-prometheus
  labels:
    app.kubernetes.io/name: opentelemetry-demo
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: prometheus
      protocol: TCP
      name: prometheus
  selector:
    app.kubernetes.io/name: opentelemetry-demo
    app.kubernetes.io/component: prometheus
