apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: email
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      serviceAccountName: email-service
      containers:
      - name: email
        image: ghcr.io/lgu-se-internal/opentelemetry-demo/email:latest
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9464
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector:4318
        - name: OTEL_SERVICE_NAME
          value: email
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=opentelemetry-demo
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
