apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  labels:
    app.kubernetes.io/name: llm-service
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-service
    spec:
      containers:
      - name: llm-service
        image: llm-service:latest
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: LLM_RATE_LIMIT
          value: "100"
        - name: LLM_SHUTDOWN_TIMEOUT
          value: "30s"
        - name: LLM_TLS_CERT_PATH
          value: ""
        - name: LLM_TLS_KEY_PATH
          value: ""
        ports:
        - containerPort: 8080
          name: http
