apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    app: flagd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagd
  template:
    metadata:
      labels:
        app: flagd
    spec:
      containers:
      - name: flagd
        image: ghcr.io/open-feature/flagd:v0.6.0
        ports:
        - containerPort: 8013
          name: grpc-eval
        - containerPort: 8014
          name: http-health
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8014
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8014
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: flagd-config
          mountPath: /etc/flagd
        - name: tls-certs
          mountPath: /etc/flagd/tls
        command: ["/entrypoint.sh"]
      volumes:
      - name: flagd-config
        configMap:
          name: flagd-config
      - name: tls-certs
        secret:
          secretName: flagd-tls
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
  labels:
    app: flagd
spec:
  ports:
  - port: 8013
    name: grpc-eval
  - port: 8014
    name: http-health
  selector:
    app: flagd
