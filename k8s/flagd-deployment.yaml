apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    app: flagd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagd
  template:
    metadata:
      labels:
        app: flagd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
      - name: set-permissions
        image: busybox:stable
        command: ["sh", "-c", "chown -R 1001:1001 /var/lib/flagd/config"]
        securityContext:
          runAsUser: 0
          privileged: true
        volumeMounts:
        - name: flagd-custom-config
          mountPath: /var/lib/flagd/config
      containers:
      - name: flagd
        image: ghcr.io/open-feature/flagd:v0.6.0
        ports:
        - containerPort: 8013
          name: grpc-eval
        - containerPort: 8014
          name: http-health
        env:
        - name: FLAGD_TLS_ENABLED
          value: "false"
        - name: FLAGD_CUSTOM_CONFIG_PATH
          value: "/var/lib/flagd/config/flags.json"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8013
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8013
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: flagd-config
          mountPath: /etc/flagd
        - name: tls-certs
          mountPath: /etc/flagd/tls
        - name: flagd-custom-config
          mountPath: /var/lib/flagd/config
        command: ["/entrypoint.sh"]
      volumes:
      - name: flagd-config
        configMap:
          name: flagd-config
      - name: tls-certs
        secret:
          secretName: flagd-tls
      - name: flagd-custom-config
        persistentVolumeClaim:
          claimName: flagd-custom-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flagd-custom-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
  labels:
    app: flagd
spec:
  ports:
  - port: 8013
    name: grpc-eval
  - port: 8014
    name: http-health
  selector:
    app: flagd
