apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  labels:
    app.kubernetes.io/name: recommendationservice
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendationservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendationservice
        app.kubernetes.io/instance: recommendation-service
        app.kubernetes.io/version: {{ .Values.image.tag | default "latest" }}
        app.kubernetes.io/component: recommendation-service
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/managed-by: Helm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: recommendation-service
        image: {{ .Values.image.repository | default "otel/opentelemetry-demo-recommendation" }}:{{ .Values.image.tag | default "latest" }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
        env:
        - name: PORT
          value: "8080"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.exporter.otlp.endpoint | default "http://otel-collector:4317" }}
        - name: TLS_ENABLED
          value: {{ .Values.tls.enabled | default "false" | quote }}
        - name: RETRY_MAX_ATTEMPTS
          value: {{ .Values.retry.maxAttempts | default "3" | quote }}
        - name: UPSTREAM_CATALOG_SERVICE_ADDR
          value: {{ .Values.upstream.catalogServiceAddr | default "productcatalogservice:8080" }}
        ports:
        - containerPort: 8080
          name: grpc
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | default "100m" }}
            memory: {{ .Values.resources.requests.memory | default "128Mi" }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | default "200m" }}
            memory: {{ .Values.resources.limits.memory | default "256Mi" }}
