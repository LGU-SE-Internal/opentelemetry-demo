apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/version: v2.47.0
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/version: v2.47.0
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        privileged: false
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v2.47.0
        env:
        - name: PROMETHEUS_TLS_ENABLED
          value: "false"
        - name: PROMETHEUS_TLS_CERT_PATH
          value: "/etc/prometheus/tls/tls.crt"
        - name: PROMETHEUS_TLS_KEY_PATH
          value: "/etc/prometheus/tls/tls.key"
        - name: PROMETHEUS_MTLS_ENABLED
          value: "false"
        - name: PROMETHEUS_CA_CERT_PATH
          value: "/etc/prometheus/tls/ca.crt"
        ports:
        - containerPort: 9090
          name: http
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
          readOnly: true
        - name: prometheus-tls
          mountPath: /etc/prometheus/tls
          readOnly: true
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-tls
        secret:
          secretName: prometheus-tls
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: http
    name: http
  selector:
    app.kubernetes.io/name: prometheus

