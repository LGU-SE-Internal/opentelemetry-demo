apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        readOnlyRootFilesystem: true
      containers:
      - name: grafana
        image: grafana/grafana:11.2.0
        ports:
        - containerPort: 3000
          name: grafana
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          privileged: false
          capabilities:
            drop:
              - ALL
        env:
        - name: GRAFANA_LIVENESS_PROBE_INITIAL_DELAY_SECONDS
          value: "$(GRAFANA_LIVENESS_PROBE_INITIAL_DELAY_SECONDS:30)"
        - name: GRAFANA_LIVENESS_PROBE_PERIOD_SECONDS
          value: "$(GRAFANA_LIVENESS_PROBE_PERIOD_SECONDS:10)"
        - name: GRAFANA_READINESS_PROBE_INITIAL_DELAY_SECONDS
          value: "$(GRAFANA_READINESS_PROBE_INITIAL_DELAY_SECONDS:5)"
        - name: GRAFANA_READINESS_PROBE_PERIOD_SECONDS
          value: "$(GRAFANA_READINESS_PROBE_PERIOD_SECONDS:5)"
        - name: GRAFANA_RESOURCE_REQUEST_CPU
          value: "$(GRAFANA_RESOURCE_REQUEST_CPU:100m)"
        - name: GRAFANA_RESOURCE_REQUEST_MEMORY
          value: "$(GRAFANA_RESOURCE_REQUEST_MEMORY:256Mi)"
        - name: GRAFANA_RESOURCE_LIMIT_CPU
          value: "$(GRAFANA_RESOURCE_LIMIT_CPU:500m)"
        - name: GRAFANA_RESOURCE_LIMIT_MEMORY
          value: "$(GRAFANA_RESOURCE_LIMIT_MEMORY:512Mi)"
        - name: GRAFANA_RUN_USER_UID
          value: "$(GRAFANA_RUN_USER_UID:472)"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-datasources-config
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-tmp
          mountPath: /tmp
        - name: grafana-log
          mountPath: /var/log/grafana
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-storage
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards
      - name: grafana-datasources-config
        configMap:
          name: grafana-datasources
      - name: grafana-tmp
        emptyDir: {}
      - name: grafana-log
        emptyDir: {}
