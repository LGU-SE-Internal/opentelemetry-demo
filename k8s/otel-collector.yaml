apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    # Copyright The OpenTelemetry Authors
    # SPDX-License-Identifier: Apache-2.0

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: ${env:OTEL_COLLECTOR_MEMORY_LIMIT_MIB}
        spike_limit_mib: 128
      ratelimit:
        global:
          spans_per_second: ${env:OTEL_COLLECTOR_GLOBAL_RATE_LIMIT_SPS}
        per_attribute:
          key: service.name
          spans_per_second: ${env:OTEL_COLLECTOR_PER_SERVICE_RATE_LIMIT_SPS}
      batch:
        send_batch_size: 1000
        timeout: 10s
        send_batch_max_size: 10000

    exporters:
      logging:
        loglevel: info

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, ratelimit, batch]
          exporters: [logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, ratelimit, batch]
          exporters: [logging]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, ratelimit, batch]
          exporters: [logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.100.0
        args: ["--config", "/etc/otelcol-contrib/config.yaml"]
        ports:
        - containerPort: 4317
          name: grpc
        - containerPort: 4318
          name: http
        - containerPort: 13133
          name: health
        - containerPort: 55679
          name: zpages
        env:
        - name: OTEL_COLLECTOR_MEMORY_LIMIT_MIB
          value: "768"
        - name: OTEL_COLLECTOR_GLOBAL_RATE_LIMIT_SPS
          value: "10000"
        - name: OTEL_COLLECTOR_PER_SERVICE_RATE_LIMIT_SPS
          value: "2000"
        - name: OTEL_COLLECTOR_QUEUE_SIZE
          value: "1000"
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol-contrib/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 4317
    targetPort: grpc
  - name: http
    port: 4318
    targetPort: http
  - name: health
    port: 13133
    targetPort: health
  - name: zpages
    port: 55679
    targetPort: zpages
  selector:
    app: otel-collector
