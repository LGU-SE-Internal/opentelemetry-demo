apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/instance: opentelemetry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/instance: opentelemetry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      volumes:
        - name: jaeger-storage
          persistentVolumeClaim:
            claimName: jaeger-storage
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          args:
            - --storage.type=badger
            - --badger.ephemeral=false
            - --badger.directory-key=/tmp/jaeger/keys
            - --badger.directory-value=/tmp/jaeger/values
          ports:
            - containerPort: 16686
              name: query
            - containerPort: 14269
              name: health
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 14269
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: jaeger-storage
              mountPath: /tmp/jaeger
              readOnly: false
