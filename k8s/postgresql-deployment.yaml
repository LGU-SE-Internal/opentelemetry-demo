apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: postgresql
          image: otel/demo-postgresql:latest
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: otel-demo-postgresql
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otel-demo-postgresql
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: otel-demo-postgresql
                  key: postgres-db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_LIVENESS_PROBE_INITIAL_DELAY_SECONDS
              value: "30"
            - name: POSTGRES_LIVENESS_PROBE_PERIOD_SECONDS
              value: "10"
            - name: POSTGRES_LIVENESS_PROBE_TIMEOUT_SECONDS
              value: "5"
            - name: POSTGRES_LIVENESS_PROBE_FAILURE_THRESHOLD
              value: "3"
            - name: POSTGRES_READINESS_PROBE_INITIAL_DELAY_SECONDS
              value: "5"
            - name: POSTGRES_READINESS_PROBE_PERIOD_SECONDS
              value: "5"
            - name: POSTGRES_READINESS_PROBE_TIMEOUT_SECONDS
              value: "3"
            - name: POSTGRES_READINESS_PROBE_FAILURE_THRESHOLD
              value: "3"
            - name: POSTGRES_RESOURCES_REQUESTS_CPU
              value: "500m"
            - name: POSTGRES_RESOURCES_REQUESTS_MEMORY
              value: "1Gi"
            - name: POSTGRES_RESOURCES_LIMITS_CPU
              value: "2"
            - name: POSTGRES_RESOURCES_LIMITS_MEMORY
              value: "4Gi"
            - name: POSTGRES_RUN_AS_USER
              value: "1001"
            # TLS/mTLS Configuration Options
            # Toggle for TLS encryption support. When set to true, PostgreSQL listens for TLS connections on port 5432.
            - name: POSTGRES_TLS_ENABLED
              value: "false"
            # Path to server TLS certificate file
            - name: POSTGRES_TLS_CERT_PATH
              value: "/etc/postgresql/certs/tls.crt"
            # Path to server TLS private key file
            - name: POSTGRES_TLS_KEY_PATH
              value: "/etc/postgresql/certs/tls.key"
            # Path to CA certificate for client authentication
            - name: POSTGRES_TLS_CA_PATH
              value: "/etc/postgresql/certs/ca.crt"
            # Toggle for mandatory client certificate authentication (mTLS). Requires POSTGRES_TLS_ENABLED=true to take effect.
            - name: POSTGRES_MTLS_ENABLED
              value: "false"
          securityContext:
            runAsNonRoot: true
            runAsUser: $(POSTGRES_RUN_AS_USER)
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "localhost"]
            initialDelaySeconds: $(POSTGRES_LIVENESS_PROBE_INITIAL_DELAY_SECONDS)
            periodSeconds: $(POSTGRES_LIVENESS_PROBE_PERIOD_SECONDS)
            timeoutSeconds: $(POSTGRES_LIVENESS_PROBE_TIMEOUT_SECONDS)
            failureThreshold: $(POSTGRES_LIVENESS_PROBE_FAILURE_THRESHOLD)
            successThreshold: 1
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "localhost"]
            initialDelaySeconds: $(POSTGRES_READINESS_PROBE_INITIAL_DELAY_SECONDS)
            periodSeconds: $(POSTGRES_READINESS_PROBE_PERIOD_SECONDS)
            timeoutSeconds: $(POSTGRES_READINESS_PROBE_TIMEOUT_SECONDS)
            failureThreshold: $(POSTGRES_READINESS_PROBE_FAILURE_THRESHOLD)
            successThreshold: 1
          resources:
            requests:
              cpu: $(POSTGRES_RESOURCES_REQUESTS_CPU)
              memory: $(POSTGRES_RESOURCES_REQUESTS_MEMORY)
            limits:
              cpu: $(POSTGRES_RESOURCES_LIMITS_CPU)
              memory: $(POSTGRES_RESOURCES_LIMITS_MEMORY)
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: postgresql-run
              mountPath: /var/run/postgresql
            # Certificate volume mount path for TLS/mTLS
            - name: postgresql-certs
              mountPath: /etc/postgresql/certs
              readOnly: true
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-pvc
        - name: postgresql-run
          emptyDir: {}
        # TLS certificates volume (populated by cluster operators via secrets/cert-manager)
        - name: postgresql-certs
          secret:
            secretName: postgresql-tls
            optional: true
