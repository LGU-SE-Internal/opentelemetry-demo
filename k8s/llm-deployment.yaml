apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels:
    app: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      containers:
      - name: llm
        image: ${IMAGE_NAME}:${DEMO_VERSION}-llm
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: ${LLM_LIVENESS_INITIAL_DELAY}
          periodSeconds: ${LLM_LIVENESS_PERIOD}
          failureThreshold: ${LLM_LIVENESS_FAILURE_THRESHOLD}
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: ${LLM_READINESS_INITIAL_DELAY}
          periodSeconds: ${LLM_READINESS_PERIOD}
          failureThreshold: ${LLM_READINESS_FAILURE_THRESHOLD}
        resources:
          requests:
            cpu: ${LLM_CPU_REQUEST}
            memory: ${LLM_MEMORY_REQUEST}
          limits:
            cpu: ${LLM_CPU_LIMIT}
            memory: ${LLM_MEMORY_LIMIT}
        securityContext:
          runAsNonRoot: true
          runAsUser: ${LLM_RUN_AS_USER}
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: "8013"
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  labels:
    app: llm
spec:
  type: ClusterIP
  ports:
  - port: 8000
    name: http
    targetPort: http
  selector:
    app: llm
