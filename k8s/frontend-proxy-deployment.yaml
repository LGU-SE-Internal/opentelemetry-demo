apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
  labels:
    app: frontend-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-proxy
  template:
    metadata:
      labels:
        app: frontend-proxy
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend-proxy
        image: otel/demo:v1.9.0-frontend-proxy
        ports:
        - name: http
          containerPort: 8080
        - name: admin
          containerPort: 9901
        env:
        - name: ENVOY_ADMIN_PORT
          value: "9901"
        - name: FRONTEND_PROXY_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
          value: "30"
        securityContext:
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-proxy
  labels:
    app: frontend-proxy
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: admin
    port: 9901
    targetPort: 9901
  selector:
    app: frontend-proxy
