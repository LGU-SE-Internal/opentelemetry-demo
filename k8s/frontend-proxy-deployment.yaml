apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
  labels:
    app.kubernetes.io/name: frontend-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:stable-alpine
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx
        - name: var-log
          mountPath: /var/log/nginx
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-proxy-nginx-config
      - name: var-log
        emptyDir: {}
      - name: tmp
        emptyDir: {}
