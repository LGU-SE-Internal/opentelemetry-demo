apiVersion: apps/v1
kind: Deployment
metadata:
  name: productreviewservice
  labels:
    app.kubernetes.io/name: productreviewservice
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: productreviewservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: productreviewservice
        app.kubernetes.io/part-of: opentelemetry-demo
        app.kubernetes.io/component: service
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: productreviewservice
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        privileged: false
      containers:
      - name: productreviewservice
        image: {{ .Values.image.repository | default "otel/opentelemetry-demo-product-reviews" }}:{{ .Values.image.tag | default "latest" }}
        env:
        - name: PORT
          value: "8080"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.exporter.otlp.endpoint | default "http://otel-collector:4317" }}
        - name: TLS_ENABLED
          value: {{ .Values.tls.enabled | default "false" | quote }}
        ports:
        - containerPort: 8080
          name: grpc
        livenessProbe:
          grpc:
            port: 8080
            service: productreviewservice
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 8080
            service: productreviewservice
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | default "100m" }}
            memory: {{ .Values.resources.requests.memory | default "128Mi" }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | default "200m" }}
            memory: {{ .Values.resources.limits.memory | default "256Mi" }}
