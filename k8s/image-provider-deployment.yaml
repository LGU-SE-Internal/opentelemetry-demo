apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-provider
  labels:
    app: image-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-provider
  template:
    metadata:
      labels:
        app: image-provider
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
      # Uncomment to enable TLS/mTLS:
      # volumes:
      #   - name: tls-cert
      #     secret:
      #       secretName: image-provider-tls # Secret containing tls.crt and tls.key
      #   - name: client-ca
      #     secret:
      #       secretName: image-provider-client-ca # Optional: Secret containing ca.crt for mTLS
      containers:
      - name: image-provider
        image: ${IMAGE_NAME}:${DEMO_VERSION}-image-provider
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        # Uncomment to enable TLS/mTLS:
        # volumeMounts:
        #   - name: tls-cert
        #     mountPath: /etc/nginx/tls
        #     readOnly: true
        #   - name: client-ca
        #     mountPath: /etc/nginx/client-ca
        #     readOnly: true
        env:
          # TLS configuration (optional)
          # - name: ENABLE_TLS
          #   value: "true"
          # - name: SSL_CERTIFICATE
          #   value: /etc/nginx/tls/tls.crt
          # - name: SSL_CERTIFICATE_KEY
          #   value: /etc/nginx/tls/tls.key
          # - name: SSL_PROTOCOLS
          #   value: "TLSv1.2 TLSv1.3"
          # Uncomment below to enable mTLS (requires client CA secret):
          # - name: SSL_CLIENT_CERTIFICATE
          #   value: /etc/nginx/client-ca/ca.crt
          # - name: SSL_VERIFY_CLIENT
          #   value: "on"
---
apiVersion: v1
kind: Service
metadata:
  name: image-provider
  labels:
    app: image-provider
spec:
  type: ClusterIP
  selector:
    app: image-provider
  ports:
  - port: 8080
    targetPort: http
    name: http
  # Uncomment to expose HTTPS port when TLS is enabled:
  # - port: 443
  #   targetPort: 8080
  #   name: https
