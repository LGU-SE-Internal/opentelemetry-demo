apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app.kubernetes.io/name: cartservice
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cartservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cartservice
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cartservice
        image: otel/demo-cartservice:latest
        ports:
        - containerPort: 8080
          name: grpc
        securityContext:
          capabilities:
            drop:
            - ALL
        livenessProbe:
          grpc:
            port: 8080
            service: ""
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          grpc:
            port: 8080
            service: ""
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: REDIS_ADDR
          value: "redis:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
              optional: true
        - name: TLS_CERT_PATH
          value: ""
        - name: TLS_KEY_PATH
          value: ""
        - name: MTLS_CA_CERT_PATH
          value: ""
        - name: CART_VALKEY_TLS_ENABLED
          value: ""
        - name: CART_VALKEY_TLS_INSECURE_SKIP_VERIFY
          value: ""
        - name: CART_VALKEY_CA_CERT_PATH
          value: ""
        - name: CART_VALKEY_CLIENT_CERT_PATH
          value: ""
        - name: CART_VALKEY_CLIENT_KEY_PATH
          value: ""
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: valkey-ca-cert
          mountPath: /certs/valkey/ca
          readOnly: true
        - name: valkey-client-cert
          mountPath: /certs/valkey/client
          readOnly: true
        - name: valkey-client-key
          mountPath: /certs/valkey/client
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: valkey-ca-cert
        secret:
          secretName: valkey-ca-cert
          optional: true
      - name: valkey-client-cert
        secret:
          secretName: valkey-client-cert
          optional: true
      - name: valkey-client-key
        secret:
          secretName: valkey-client-key
          optional: true
